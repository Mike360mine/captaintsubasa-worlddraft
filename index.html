  /* Explicación de la química con el once actual: reglas, puntos de cada jugador y vínculos */
  function chemHtml(slots) {
    const players = (slots || []).map((s) => s.player).filter(Boolean);
    const chem = CT.chemistry(players);
    const names = new Set(players.map((p) => p.names.orig));
    const pn = (m) => (CT.BY_NAME[m] ? CT.pname(CT.BY_NAME[m], true) : m);
    const dots = (n) => `<span class="chem-dots" aria-label="${n}/3">${[0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
    const inBond = new Set(); chem.bonds.forEach((b) => b.present.forEach((m) => inBond.add(m)));
    const rows = players.slice().sort((a, b) => (chem.perPlayer[b.id] || 0) - (chem.perPlayer[a.id] || 0) || b.r - a.r).map((p) => {
      const mates = players.filter((q) => q !== p && q.nat === p.nat).length;
      const why = [mates === 0 ? t("mates0") : mates === 1 ? t("mate1") : t("mates", { n: mates })];
      if (inBond.has(p.names.orig)) why.push("🔗 " + chem.bonds.filter((b) => b.present.includes(p.names.orig)).map((b) => esc(CT.bondName(b))).join(", "));
      return `<tr><td>${flag(p.nat)} ${esc(CT.pname(p, true))}</td><td class="muted small">${why.join(" · ")}</td><td>${dots(chem.perPlayer[p.id] || 0)}</td></tr>`;
    }).join("");
    const bondLine = (b, showMissing) => {
      const have = b.members.filter((m) => names.has(m));
      const mem = b.members.map((m) => `<span class="bm${names.has(m) ? " have" : ""}">${esc(pn(m))}${!names.has(m) && showMissing ? ` <small>${t("missing")}</small>` : ""}</span>`).join("");
      return `<li class="bond-item"><div class="bi-head"><b>${esc(CT.bondName(b))}</b><span class="tag">${have.length}/${b.need}</span></div>
        <div class="bi-mem">${b.members.length > b.need ? `<span class="muted small">${t("needMore", { n: b.need })}</span>` : ""}${mem}</div></li>`;
    };
    const active = chem.bonds;
    const activeIds = new Set(active.map((b) => b.id));
    const near = CT.BONDS.filter((b) => !activeIds.has(b.id) && b.members.filter((m) => names.has(m)).length >= Math.max(1, b.need - 1));
    const all = CT.BONDS.filter((b) => !activeIds.has(b.id) && !near.includes(b));
    return `<h2 class="h2">${t("chemTitle")}</h2>
      <p>${t("chemIntro")}</p>
      <h3 class="lbl">${t("chemRulesH")}</h3>
      <table class="table chem-rules"><tbody>
        <tr><td>${t("chemR1")}</td><td>${t("chemPt")}</td></tr>
        <tr><td>${t("chemR2")}</td><td>${t("chemPt")}</td></tr>
        <tr><td>${t("chemR3")}</td><td>${t("chemPt")}</td></tr>
      </tbody></table>
      <p class="small">${t("chemFormula")}</p>
      <p class="small muted">${t("chemExtra")}</p>
      ${players.length ? `<h3 class="lbl">${t("yourXI")} · ${Math.round(chem.pct * 100)}% (+${fmt(chem.bonus)})</h3>
        <table class="table chem-xi"><tbody>${rows}</tbody></table>` : ""}
      <h3 class="lbl">${t("bondsH")}</h3>
      <p class="small">${t("bondsIntro")}</p>
      <h4 class="lbl sm">${t("activeH")}</h4>
      ${active.length ? `<ul class="bond-list">${active.map((b) => bondLine(b, false)).join("")}</ul>` : `<p class="muted small">${t("noActive")}</p>`}
      ${near.length ? `<h4 class="lbl sm">${t("nearH")}</h4><ul class="bond-list">${near.map((b) => bondLine(b, true)).join("")}</ul>` : ""}
      <details class="all-bonds"><summary>${t("allBondsH", { n: CT.BONDS.length })}</summary><ul class="bond-list">${all.map((b) => bondLine(b, false)).join("")}</ul></details>
      <button class="btn primary" data-act="closeModal">${t("close")}</button>`;
  }

  /* ================================================================ FLUJO */
  function dailySeed() { return CT.hashStr("ctwd-daily-" + CT.todayKey()); }

  function startDraft() {
    const M = CT.MODES[S.mode];
    const nameEl = $("#team-name");
    const name = ((nameEl && nameEl.value.trim()) || t("teamNameDefault")).slice(0, 22);
    S.setup.name = name;
    const seed = M.seeded ? dailySeed() : CT.randomSeed();
    const practice = !!(M.seeded && CT.daily[CT.todayKey()]);
    S.draft = CT.newDraft({ mode: S.mode, formation: S.setup.formation, seed, teamName: name, diff: S.setup.diff });
    S.run = { mode: S.mode, diff: S.draft.diff, practice, seed, results: [], scorers: {}, lines: [], goals: 0, ga: 0 };
    S.tactic = "bal";
    go("draft");
  }

  function doRoll() {
    const d = S.draft;
    if (d.current || CT.draftComplete(d)) return;
    const btn = $("#btn-roll"); if (btn) btn.classList.add("spin");
    CT.sfx.kick();
    setTimeout(() => {
      const r = CT.rollDraft(d);
      render();
      if (window.innerWidth < 900) { const ra = $("#roll-area"); if (ra) ra.scrollIntoView({ behavior: CT.fx.reduced() ? "auto" : "smooth", block: "start" }); }
      r.players.forEach((_, i) => CT.sfx.card(i));
      if (r.dream) { CT.sfx.dream(); toast(t("dreamToast"), "gold"); }
    }, CT.fx.reduced() ? 0 : 380);
  }

  function doPick(id) {
    const d = S.draft;
    const p = CT.BY_ID[id];
    if (!CT.pickPlayer(d, id)) return;
    CT.sfx.sign();
    CT.album.add(p.id);
    toast(t("signed", { p: CT.pname(p, true), t: d.teamName }));
    if (CT.draftComplete(d)) {
      d.captainId = d.slots.map((s) => s.player).sort((a, b) => b.r - a.r)[0].id;
      CT.stats.drafts++;
      checkDraftAchievements(d);
      CT.saveProfile();
      go("captain");
    } else {
      render();
    }
  }

  function toCup() {
    const d = S.draft;
    S.team = CT.makeTeam({ key: "USER", name: d.teamName, flag: "⭐", slots: d.slots, captainId: d.captainId, isUser: true, formation: d.formation });
    const diffMod = CT.DIFFICULTY[S.run.diff];
    const rng = CT.makeRng((S.run.seed ^ 0x9e3779b9) >>> 0);
    S.run.rng = rng;
    S.run.ov = S.team.ov;
    if (d.M.cup === "survival") {
      S.surv = { wins: 0, results: [], baseMod: diffMod, next: null, last: null };
      S.surv.next = CT.survivalOpponent(rng, 0, diffMod, null, new Set(S.team.players.map((p) => p.id)));
      S.wc = null;
    } else {
      S.wc = CT.createWorldCup(S.team, rng, diffMod);
      S.surv = null;
    }
    S.cupTab = "path";
    go("cup");
  }

  function playNext() {
    if (S.run.mode === "survival") {
      const sv = S.surv;
      startLive({ rival: sv.next, knockout: true, stageTxt: t("stage.surv", { n: sv.results.length + 1 }), seed: S.run.rng.int(4294967295) });
      return;
    }
    const wc = S.wc, uf = CT.userFixture(wc);
    const rival = uf.a.isUser ? uf.b : uf.a;
    startLive({ rival, knockout: uf.knockout, stageTxt: stageLabel(wc.stages[wc.stageIdx].id), seed: wc.rng.int(4294967295) });
  }

  // Estadísticas y logros del partido del usuario
  function onUserMatchEnd(m) {
    const gs = m.score[0], gc = m.score[1], w = m.winner();
    if (!S.live.counted) {
      S.live.counted = true;
      CT.stats.matches++;
      if (w === 0 && gs !== gc) CT.stats.w++; else if (gs === gc) CT.stats.d++; else CT.stats.l++;
      CT.stats.gf += gs; CT.stats.ga += gc;
      S.run.goals += gs; S.run.ga += gc;
      const perScorer = {};
      for (const e of m.events) if (e.type === "goal" && e.side === 0) {
        CT.stats.scorers[e.p.id] = (CT.stats.scorers[e.p.id] || 0) + 1;
        S.run.scorers[e.p.id] = (S.run.scorers[e.p.id] || 0) + 1;
        perScorer[e.p.id] = (perScorer[e.p.id] || 0) + 1;
        if (e.tech === "skylab" || e.tech === "skylabtwin") unlock("skylab");
      }
      if (Object.values(perScorer).some((n) => n >= 3)) unlock("hattrick");
      if (gs - gc >= 5) unlock("goleada");
      if (m.pens && w === 0) unlock("penalties");
      CT.saveProfile();
    }
  }

  function afterMatch() {
    const L = S.live; if (!L || L.running) return;
    const m = L.m;
    if (L.pitch) L.pitch.stop();
    S.live = null;
    if (S.run.mode === "survival") {
      const sv = S.surv, w = m.winner();
      sv.results.push({ nat: sv.next.nat, gs: m.score[0], gc: m.score[1], pens: m.pens ? `${m.pens[0]}-${m.pens[1]}` : null, w: w === 0 ? "w" : "l" });
      S.run.lines.push(`${w === 0 ? "✅" : "❌"}${m.score[0]}-${m.score[1]}${CT.NATIONS[sv.next.nat].flag}`);
      if (w === 0) {
        sv.wins++;
        if (sv.wins >= 5) unlock("survival5");
        if (sv.wins >= 12) unlock("survival12");
        if (sv.wins > CT.stats.bestSurv) CT.stats.bestSurv = sv.wins;
        sv.last = sv.next.nat;
        sv.next = CT.survivalOpponent(S.run.rng, sv.wins, sv.baseMod, sv.last, new Set(S.team.players.map((p) => p.id)));
        CT.saveProfile();
        go("cup");
      } else {
        finishRun({ survLost: sv.next });
      }
      return;
    }
    const wc = S.wc, uf = CT.userFixture(wc);
    const userA = uf.a.isUser;
    const adapter = userA ? m : {
      score: [m.score[1], m.score[0]], pens: m.pens ? [m.pens[1], m.pens[0]] : null,
      winner: () => { const w = m.winner(); return w === -1 ? -1 : 1 - w; }
    };
    CT.recordResult(wc, uf, adapter);
    uf.match = m;
    const st = wc.stages[wc.stageIdx];
    const tag = { md1: "J1", md2: "J2", md3: "J3", qf: "QF", sf: "SF", final: "F" }[st.id];
    const w = m.winner();
    S.run.lines.push(`${tag}${w === 0 ? "✅" : w === -1 ? "➖" : "❌"}${m.score[0]}-${m.score[1]}${m.pens ? `(${m.pens[0]}-${m.pens[1]})` : ""}${teamFlag(m.T[1])}`);
    if (st.id === "final") {
      S.run.reachedFinal = true;
      if (w === 0 && m.score[1] === 0) unlock("clean_final");
    }
    CT.playOthers(wc);
    CT.advanceWorldCup(wc);
    if (wc.champion || wc.userOut) {
      if (wc.champion && wc.champion.isUser) return finishRun({ champ: true });
      if (wc.userOut) return finishRun({ champ: false });
    }
    go("cup");
  }

  function simRest() {
    const wc = S.wc;
    while (!wc.champion) {
      const uf = CT.userFixture(wc);
      if (uf && !uf.result) { const m = CT.playQuick(uf.a, uf.b, { rng: wc.rng, knockout: uf.knockout }); CT.recordResult(wc, uf, m); }
      CT.playOthers(wc);
      CT.advanceWorldCup(wc);
    }
    S.run.endInfo.champLine = "🏆 " + esc(t("worldChampion", { t: CT.teamName(wc.champion) }));
    S.cupTab = "bracket";
  }

  function finishRun({ champ, survLost }) {
    const R = S.run;
    const top = Object.entries(R.scorers).sort((a, b) => b[1] - a[1])[0] || null;
    let title, sub, res;
    if (R.mode === "survival") {
      const wins = S.surv.wins;
      title = t("end.surv", { n: wins });
      sub = t("end.surv.d", { r: CT.natName(survLost.nat), best: CT.stats.bestSurv });
      res = `${wins} ${t("wins").toLowerCase()}`;
    } else if (champ) {
      title = t("end.champ"); sub = t("end.champ.d", { t: S.team.name });
      res = "🏆 " + t("champion");
    } else {
      title = t("end.out", { stage: t("out." + S.wc.userOut) }); sub = t("end.out.d");
      res = t("eliminated") + " (" + t("stage." + (S.wc.userOut === "group" ? "md3" : S.wc.userOut)) + ")";
    }
    // estadísticas de la partida
    if (champ) {
      CT.stats.titles++;
      unlock("first_title");
      if (R.diff === "legend") unlock("legend_title");
      if (R.ov < 86) unlock("underdog");
      if (R.mode === "blind") unlock("blind_title");
      if (R.mode === "hardcore") unlock("hard_title");
      if (R.mode === "daily" && !R.practice) unlock("daily_win");
    }
    if (R.reachedFinal) CT.stats.finals++;
    if (R.mode === "daily" && !R.practice) {
      CT.daily[CT.todayKey()] = { res, ov: R.ov };
      CT.stats.daily++;
    }
    CT.history.unshift({ date: CT.todayKey(), name: S.team.name, mode: R.mode, ov: R.ov, res });
    CT.saveProfile();

    const dn = CT.dailyNumber();
    const header = R.mode === "daily" ? `${t("mode.daily")} #${dn}${R.practice ? " (" + t("practice") + ")" : ""}` : `${t("mode." + R.mode)} · ${t("diff." + R.diff)}`;
    const text =
      `⚽ ${t("appKicker")} ${t("appTitle")}\n${header}\n⭐ ${S.team.name} (${S.team.formation}) · ${t("overall")} ${fmt(S.team.ov)}\n` +
      R.lines.join(" ") + "\n" + res +
      (top ? `\n👟 ${t("topScorer")}: ${CT.pname(CT.BY_ID[top[0]])} (${top[1]})` : "");
    R.endInfo = { champ: !!champ, title, sub, res, top, goals: R.goals, lines: R.lines, text, champLine: null };
    if (champ) { CT.sfx.trophy(); } else CT.sfx.lose();
    go("end");
    if (champ) setTimeout(() => CT.fx.confetti(4200), 200);
  }

  async function buildShareImage() {
    const R = S.run.endInfo;
    try {
      const url = await CT.shareCard({
        team: S.team, title: R.title,
        subtitle: `${S.team.name} · ${t("overall")} ${fmt(S.team.ov)} · ${t("chem")} ${Math.round(S.team.tr.chem.pct * 100)}%`,
        lines: R.lines, footer: `${t("mode." + S.run.mode)} · ${CT.todayKey()}`
      });
      S.run.endInfo.img = url;
    } catch (e) { /* sin canvas */ }
  }

  /* ---------- logros ---------- */
  function unlock(id) {
    if (CT.ach.has(id)) return;
    CT.ach.add(id);
    const a = CT.ACHIEVEMENTS.find((x) => x.id === id);
    if (a) setTimeout(() => toast(t("achUnlocked", { a: CT.achName(a) }), "gold"), 400);
  }
  function checkDraftAchievements(d) {
    const ps = d.slots.map((s) => s.player);
    const names = new Set(ps.map((p) => p.names.orig));
    if (names.has("Tsubasa Ozora") && names.has("Taro Misaki")) unlock("golden_combi");
    if (new Set(ps.map((p) => p.nat)).size === 11) unlock("eleven_flags");
    if (CT.chemistry(ps).pct >= 0.8) unlock("chem80");
    const pct = CT.album.size / CT.PLAYERS.length;
    if (pct >= 0.25) unlock("album25");
    if (pct >= 0.75) unlock("album75");
  }

  /* ================================================================ ACCIONES */
  const A_ = {
    mode(ds) {
      S.mode = ds.mode;
      S.setup = { name: (S.setup && S.setup.name) || t("teamNameDefault"), formation: (S.setup && S.setup.formation) || "4-4-2", diff: (S.setup && S.setup.diff) || "pro" };
      go("setup");
    },
    go(ds) { if (S.live) { if (S.live.pitch) S.live.pitch.stop(); S.live = null; } go(ds.to); },
    formation(ds) { saveName(); S.setup.formation = ds.f; render(); },
    diff(ds) { saveName(); S.setup.diff = ds.d; render(); },
    start() { CT.sfx.unlock(); startDraft(); },
    roll() { doRoll(); },
    reroll() {
      const d = S.draft;
      if (!d.current || d.rerolls <= 0) return;
      d.rerolls--; d.current = null; doRoll();
    },
    pick(ds) { doPick(ds.id); },
    captain(ds) { S.draft.captainId = ds.id; CT.sfx.click(); render(); },
    toCup() { toCup(); },
    cupTab(ds) { S.cupTab = ds.tab; render(); },
    preTactic(ds) { S.tactic = ds.t; render(); },
    tactic(ds) {
      if (!S.live) return;
      S.live.m.tactic[0] = ds.t; S.tactic = ds.t;
      document.querySelectorAll('[data-act="tactic"]').forEach((b) => { const on = b.dataset.t === ds.t; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); });
    },
    play() { CT.sfx.unlock(); playNext(); },
    speed() {
      CT.settings.speed = CT.settings.speed === 1 ? 2 : CT.settings.speed === 2 ? 4 : 1;
      CT.saveProfile();
      const b = $("#btn-speed"); if (b) b.textContent = t("speed", { n: CT.settings.speed });
    },
    sound() {
      CT.settings.sound = !CT.settings.sound; CT.saveProfile();
      const b = $("#btn-sound"); if (b) b.textContent = CT.settings.sound ? t("soundOff") : t("soundOn");
    },
    skip() { if (S.live) { S.live.skipping = true; const b = $("#btn-skip"); if (b) b.disabled = true; } },
    afterMatch() { afterMatch(); },
    simRest() { simRest(); render(); },
    viewBracket() { S.cupTab = "bracket"; go("cup"); },
    toEnd() { go("end"); },
    async copyResult() {
      const txt = S.run.endInfo.text;
      try { await navigator.clipboard.writeText(txt); toast(t("copied")); }
      catch (e) { const ta = $("#share-text"); if (ta) { ta.focus(); ta.select(); try { document.execCommand("copy"); toast(t("copied")); } catch (e2) {} } }
    },
    async saveImage() {
      if (!S.run.endInfo.img) await buildShareImage();
      const url = S.run.endInfo.img; if (!url) return;
      const img = $("#share-img"), hint = $("#share-hint");
      if (img) { img.src = url; img.hidden = false; }
      if (hint) hint.hidden = false;
      // descarga directa en tu propio dominio; dentro del visor de Claude basta con la imagen
      if (!root.CT_ARTIFACT) try {
        const a = document.createElement("a"); a.href = url; a.download = "ct-world-draft.png";
        document.body.appendChild(a); a.click(); a.remove();
      } catch (e) {}
    },
    albumNat(ds) { S.album.nat = ds.n; render(); },
    albumPos(ds) { S.album.pos = ds.p; render(); },
    settings() { openModal(settingsHtml()); },
    how() { openModal(howHtml()); },
    chem() {
      const slots = (S.screen === "draft" || S.screen === "captain") && S.draft ? S.draft.slots : S.team ? S.team.slots : [];
      openModal(chemHtml(slots));
    },
    closeModal() { closeModal(); },
    set(ds) {
      let v = ds.v; if (v === "true") v = true; else if (v === "false") v = false;
      CT.settings[ds.k] = v; CT.saveProfile();
      openModal(settingsHtml());
      if (!S.live) render();
    },
    resetAsk() {
      const z = $("#reset-zone");
      z.innerHTML = `<p>${t("resetConfirm")}</p><div class="btn-row"><button class="btn danger-btn sm" data-act="resetYes">${t("resetYes")}</button><button class="btn ghost sm" data-act="resetNo">${t("cancel")}</button></div>`;
    },
    resetNo() { openModal(settingsHtml()); },
    resetYes() {
      const keep = Object.assign({}, CT.settings);
      CT.store.clear(); CT.loadProfile(); CT.settings = keep; CT.saveProfile();
      toast(t("resetDone")); openModal(settingsHtml()); if (!S.live) render();
    }
  };
  CT.actions = A_;
  CT._state = () => S;
  function saveName() { const el = $("#team-name"); if (el && S.setup) S.setup.name = el.value; }

  /* ================================================================ EVENTOS */
  function bind() {
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b || b.disabled) return;
      const fn = A_[b.dataset.act];
      if (fn) { e.preventDefault(); fn(b.dataset, b, e); }
    });
    document.addEventListener("input", (e) => {
      if (e.target.id === "album-q") {
        S.album.q = e.target.value; const pos = e.target.selectionStart; render();
        const q = $("#album-q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) {} }
      }
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "album-missing") { S.album.missing = e.target.checked; render(); }
      if (e.target.id === "set-autoplay") { CT.settings.autoplay = e.target.checked; CT.saveProfile(); }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$("#modal").hidden) { closeModal(); return; }
      if (e.target.matches("input, textarea")) return;
      if (S.screen === "draft" && S.draft) {
        if (/^[1-5]$/.test(e.key) && S.draft.current) { const p = S.draft.current.players[+e.key - 1]; if (p) doPick(p.id); }
        if ((e.key === "r" || e.key === "R" || e.key === " ") && !S.draft.current) { e.preventDefault(); doRoll(); }
      }
    });
  }

  CT.boot = function () {
    CT.loadProfile();
    bind();
    render();
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>CT.boot();</script>
</body>
