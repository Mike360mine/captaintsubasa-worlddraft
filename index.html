<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captain Tsubasa World Draft</title>
<meta name="description" content="Draft mundialista con los personajes reales de Captain Tsubasa: ficha cartas al azar, monta tu once y gana el Mundial jugado minuto a minuto.">
<meta name="theme-color" content="#0f1536">
<meta property="og:title" content="Captain Tsubasa World Draft">
<meta property="og:description" content="Ficha a las leyendas de la saga, monta tu once y gana el Mundial.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%230f1536' stroke-width='3'/%3E%3Cpath d='M16 9l6 4.4-2.3 7h-7.4L10 13.4z' fill='%230f1536'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: app de una columna (dos en escritorio durante el draft); ventanas de comandos estilo Tecmo sobre un estadio nocturno.
   Tema único oscuro, deliberado: la saga se juega de noche bajo los focos. */
:root {
  color-scheme: dark;
  /* color */
  --night: #0f1536;        /* cielo del estadio */
  --night-2: #16205a;
  --window: #1b2a8c;       /* ventana de comandos Tecmo */
  --window-2: #14206e;
  --rim: #e8ecff;          /* borde blanco de ventana */
  --text: #f3f5ff;
  --muted: #a3acd9;
  --grass: #2e8b3e;
  --grass-2: #27793a;
  --crimson: #e0303f;      /* acción, Japón, rival */
  --gold: #ffc93c;         /* balón, logros, botón principal */
  --gold-ink: #3a2a00;
  --bronze: #d79a63;
  --silver: #d8deeb;
  --good: #57d68d;
  /* tipo */
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", "Arial Black", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-pixel: "DotGothic16", "MS Gothic", ui-monospace, monospace;
  /* escala */
  --s-xs: .75rem; --s-sm: .875rem; --s-md: 1rem; --s-lg: 1.25rem; --s-xl: 1.6rem; --s-2xl: 2.2rem;
  --gap: 12px;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--night-2); }
body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 500px at 50% -120px, rgba(120, 150, 255, .28), transparent 70%),
    radial-gradient(rgba(255, 255, 255, .05) 1.2px, transparent 1.4px) 0 0 / 14px 14px,
    linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  background-color: var(--night);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--f-body);
  font-size: var(--s-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#view { display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: var(--s-sm); }
.pixel { font-family: var(--f-pixel); }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------- piezas comunes ---------- */
.h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-xl); line-height: 1.15; }
.lbl { font-family: var(--f-body); font-weight: 900; font-size: var(--s-sm); color: var(--gold); margin: 14px 0 8px; letter-spacing: .02em; }
.window {
  background: linear-gradient(180deg, var(--window), var(--window-2));
  border: 3px solid var(--rim);
  border-radius: 6px;
  box-shadow: inset 0 0 0 3px #0a1142, 0 6px 0 rgba(0, 0, 0, .35);
  padding: 16px;
}
.note { margin: 0; padding: 10px 12px; border-left: 4px solid var(--gold); background: rgba(255, 201, 60, .08); font-size: var(--s-sm); }
.note.gold { color: var(--gold); font-weight: 700; }
.note.warn { border-left-color: var(--crimson); background: rgba(224, 48, 63, .1); }
.tag { display: inline-block; font-size: var(--s-xs); font-weight: 700; padding: 2px 8px; border: 2px solid var(--rim); border-radius: 3px; white-space: nowrap; }
.tag.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 4px; cursor: pointer;
  font-weight: 900; font-size: var(--s-md); border: 3px solid transparent;
  transition: transform .08s ease, box-shadow .08s ease, background-color .15s;
  text-decoration: none;
}
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: #fff3c4; box-shadow: 0 4px 0 #9c7410; }
.btn.primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #9c7410; }
.btn.primary:hover:not(:disabled) { background: #ffd65f; }
.btn.ghost { background: rgba(255, 255, 255, .04); border-color: rgba(232, 236, 255, .5); color: var(--text); }
.btn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .1); border-color: var(--rim); }
.btn.ghost small { color: var(--muted); font-weight: 700; }
.btn.big { min-height: 54px; font-size: var(--s-lg); width: 100%; margin-top: 14px; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: var(--s-sm); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.danger-btn { background: var(--crimson); color: #fff; border-color: #ffd0d4; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.center { justify-content: center; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { flex: none; border: 2px solid rgba(232, 236, 255, .35); background: rgba(255, 255, 255, .04); border-radius: 999px; padding: 4px 12px; font-size: var(--s-sm); cursor: pointer; white-space: nowrap; }
.chip.sel { background: var(--rim); color: var(--window-2); font-weight: 700; }
.chip.bond { cursor: default; border-color: var(--gold); color: var(--gold); }
.txt { width: 100%; min-height: 46px; padding: 10px 12px; font: inherit; font-weight: 700; color: var(--text); background: #0b1245; border: 3px solid rgba(232, 236, 255, .5); border-radius: 4px; }
.txt:focus { border-color: var(--gold); outline: none; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: var(--s-sm); cursor: pointer; margin-top: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }

.screen-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.screen-head .h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* ---------- portada ---------- */
.hero { position: relative; padding: 26px 0 8px; overflow: hidden; }
.hero-pitch { position: absolute; top: 4px; right: -60px; width: 600px; height: 220px; pointer-events: none; opacity: .9; }
.hero-curve { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.hero-curve path { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 8; vector-effect: non-scaling-stroke; }
.hero-ball {
  position: absolute; width: 26px; height: 26px; border-radius: 50%; top: 0; left: 0;
  background: radial-gradient(circle at 35% 30%, #fff 0 40%, #cfd6ff 41% 60%, #2b335f 61% 66%, #fff 67%);
  box-shadow: 0 0 18px rgba(255, 255, 255, .6);
  offset-path: path("M20 190 C 180 200, 300 30, 590 60");
  offset-distance: 100%;
  animation: drive 2.4s cubic-bezier(.3, .1, .2, 1) .3s both;
}
@keyframes drive { from { offset-distance: 0%; transform: rotate(0); } to { offset-distance: 100%; transform: rotate(720deg); } }
.hero-kicker { position: relative; margin: 0; font-family: var(--f-display); color: var(--gold); font-size: var(--s-lg); }
.hero-title {
  position: relative; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(2.8rem, 11vw, 6.4rem); line-height: .95; letter-spacing: -.01em;
  text-shadow: 5px 5px 0 var(--crimson), 9px 9px 0 rgba(0, 0, 0, .4);
  transform: skewX(-7deg); transform-origin: left;
  margin: 4px 0 14px;
}
.hero-tag { position: relative; margin: 0; max-width: 34em; color: var(--muted); font-size: var(--s-lg); }

.mode-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); margin-top: 10px; }
.mode {
  display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; text-align: left;
  padding: 14px 16px; cursor: pointer;
  background: linear-gradient(180deg, var(--window), var(--window-2));
  border: 3px solid var(--rim); border-radius: 6px; box-shadow: inset 0 0 0 3px #0a1142;
  transition: transform .1s ease;
}
.mode:hover { transform: translateX(4px); }
.mode:hover .mode-ico { color: var(--gold); }
.mode-ico { width: 44px; height: 44px; color: var(--rim); }
.mode-ico svg { width: 100%; height: 100%; }
.mode-txt b { display: block; font-family: var(--f-display); font-weight: 400; font-size: var(--s-lg); line-height: 1.2; }
.mode-txt small { display: block; color: var(--muted); font-size: var(--s-sm); line-height: 1.4; margin-top: 2px; }
.mode-badge { font-size: var(--s-xs); font-weight: 900; color: var(--gold-ink); background: var(--gold); padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
.mode-badge.done { background: var(--good); color: #062b15; }
.mode-daily { border-color: var(--gold); }
.home-nav { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- configuración ---------- */
.setup { display: flex; flex-direction: column; }
.setup .lbl { margin-top: 18px; }
.form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.form-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 2px solid rgba(232, 236, 255, .3); background: #0b1245; border-radius: 4px; cursor: pointer; font-weight: 700; font-size: var(--s-sm); }
.form-opt.sel { border-color: var(--gold); background: rgba(255, 201, 60, .14); color: var(--gold); }
.mini-form { width: 40px; height: 52px; }
.mini-form rect { fill: var(--grass); stroke: rgba(255, 255, 255, .6); stroke-width: 2; }
.mini-form circle { fill: #fff; }
.form-opt.sel .mini-form circle { fill: var(--gold); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { padding: 8px 10px; min-height: 44px; border: 2px solid rgba(232, 236, 255, .3); background: #0b1245; border-radius: 4px; cursor: pointer; text-align: center; }
.seg b { display: block; font-size: var(--s-sm); }
.seg small { display: block; color: var(--muted); font-size: var(--s-xs); line-height: 1.3; }
.seg.sel { border-color: var(--gold); background: rgba(255, 201, 60, .14); }
.seg.sel b { color: var(--gold); }

/* ---------- campo y draft ---------- */
.draft { display: grid; gap: 18px; }
.draft-play { grid-template-areas: "left" "cards" "ctrl"; gap: 14px; }
.draft-play .draft-left { grid-area: left; }
.draft-play .draft-ctrl { grid-area: ctrl; }
.draft-play .roll-area { grid-area: cards; }
@media (max-width: 899px) {
  .draft-play .draft-ctrl {
    position: sticky; bottom: 0; z-index: 20; margin: 0 -16px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(10, 15, 50, .96); border-top: 3px solid var(--rim);
  }
  .draft-play .draft-ctrl .picks { font-size: var(--s-md); }
  .draft-play .draft-ctrl .btn { min-height: 44px; padding: 8px 12px; font-size: var(--s-sm); }
  .draft-play .roll-area { scroll-margin-top: 12px; }
}
@media (min-width: 900px) {
  .draft { grid-template-columns: minmax(360px, 440px) 1fr; align-items: start; }
  .draft-play { grid-template-areas: "left ctrl" "left cards"; grid-template-rows: auto 1fr; }
  .draft-left { position: sticky; top: 12px; }
}
.draft-left, .draft-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pitch {
  position: relative; padding: 18px 6px; border-radius: 6px;
  background: repeating-linear-gradient(180deg, var(--grass) 0 46px, var(--grass-2) 46px 92px);
  border: 3px solid var(--rim); box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
  display: flex; flex-direction: column; gap: 10px;
}
.pitch-lines { position: absolute; inset: 10px; border: 2px solid rgba(255, 255, 255, .45); border-radius: 2px; pointer-events: none; }
.pitch-lines::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255, 255, 255, .45); }
.pitch-lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border: 2px solid rgba(255, 255, 255, .45); border-radius: 50%; }
.prow { position: relative; z-index: 1; display: flex; justify-content: space-evenly; gap: 4px; }
.slot {
  position: relative; width: 70px; min-height: 74px; padding: 4px 2px 5px; border-radius: 5px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center;
}
.slot.empty { border: 2px dashed rgba(255, 255, 255, .55); background: rgba(10, 17, 66, .55); }
.slot.empty.open { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 201, 60, .35); animation: pulse 1.2s ease-in-out infinite; }
.slot-pos { font-family: var(--f-display); font-size: var(--s-sm); }
.slot-free { font-size: .66rem; color: rgba(255, 255, 255, .7); }
.slot.filled { color: #141a3d; border: 2px solid #0a1142; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); }
.slot-r { font-family: var(--f-display); font-size: 1.05rem; line-height: 1; }
.slot-sprite { position: absolute; left: 2px; top: 2px; width: 14px; height: auto; image-rendering: pixelated; opacity: .9; }
.slot-n { font-size: .68rem; font-weight: 900; line-height: 1.1; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-f { font-size: .8rem; line-height: 1; }
.slot-cap { position: absolute; top: -7px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-family: var(--f-display); font-size: .7rem; display: grid; place-items: center; border: 2px solid #0a1142; }
.slot-chem { display: flex; gap: 2px; margin-top: 1px; }
.slot-chem i { width: 6px; height: 6px; border-radius: 50%; background: rgba(10, 17, 66, .25); }
.slot-chem.c1 i:nth-child(1), .slot-chem.c2 i:nth-child(-n+2), .slot-chem.c3 i { background: #0d7a3a; }

.r-bronze { background: linear-gradient(160deg, #f0c49b, var(--bronze)); }
.r-silver { background: linear-gradient(160deg, #ffffff, var(--silver)); }
.r-gold { background: linear-gradient(160deg, #fff1b8, var(--gold)); }
.r-legend { background: linear-gradient(150deg, #ffe27a 0%, #ff8a5c 45%, var(--crimson) 100%); }
.r-hidden { background: linear-gradient(160deg, #c9cfe6, #8f99c4); }

.linebar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.lb { text-align: center; padding: 6px 2px; background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 4px; font-size: var(--s-xs); color: var(--muted); }
.lb b { display: block; font-family: var(--f-display); font-weight: 400; font-size: var(--s-lg); color: var(--text); line-height: 1.2; font-variant-numeric: tabular-nums; }
.lb.total { border-color: var(--gold); }
.lb.total b { color: var(--gold); }
.lb.chem b { color: var(--good); }
.bonds-box .lbl { margin-top: 0; }

.draft-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.picks { font-family: var(--f-display); font-size: var(--s-lg); margin-right: auto; }
.roll-ball, .big-ball {
  display: inline-block; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 38%, #d9deff 39% 58%, #2b335f 59% 64%, #fff 65%);
}
.roll-ball { width: 22px; height: 22px; }
.btn.spin .roll-ball { animation: spin .4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.roll-area { min-height: 220px; }
.roll-empty { display: grid; place-items: center; gap: 10px; text-align: center; padding: 30px 10px; border: 3px dashed rgba(232, 236, 255, .3); border-radius: 6px; color: var(--muted); }
.big-ball { width: 72px; height: 72px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(25deg); } }
.roll-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.roll-head.dream .tag { animation: pulse 1s ease-in-out infinite; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); perspective: 900px; }

/* carta de jugador */
.pcard {
  position: relative; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
  min-height: 210px; padding: 10px 11px 12px; border-radius: 8px;
  color: #141a3d; border: 3px solid #0a1142; box-shadow: 0 5px 0 rgba(0, 0, 0, .4);
  animation: flipin .5s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: calc(var(--i) * 90ms);
  transition: transform .12s ease;
  overflow: hidden;
}
.pcard:hover { transform: translateY(-4px) rotate(-.6deg); }
.pcard:active { transform: translateY(1px); }
@keyframes flipin { from { opacity: 0; transform: rotateY(90deg) translateY(10px); } to { opacity: 1; transform: none; } }
.pcard.r-legend::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .55) 45%, transparent 60%);
  background-size: 250% 100%; animation: sheen 2.6s ease-in-out infinite;
}
@keyframes sheen { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.pc-sprite { position: absolute; right: 6px; top: 40px; width: 60px; height: auto; image-rendering: pixelated; opacity: .95; pointer-events: none; }
.pcard .pc-name, .pcard .pc-full, .pcard .pc-alt, .pcard .pc-nat { padding-right: 52px; }
.pcard .pc-tech, .pcard .pc-bond { position: relative; z-index: 1; }
.pc-key { position: absolute; right: 8px; bottom: 6px; font-family: var(--f-pixel); font-size: var(--s-xs); opacity: .55; }
.pc-new { position: absolute; right: -28px; bottom: 12px; z-index: 2; width: 100px; text-align: center; background: var(--crimson); color: #fff; font-family: var(--f-pixel); font-size: 10px; letter-spacing: .06em; padding: 2px 0; transform: rotate(-45deg); box-shadow: 0 2px 0 rgba(0,0,0,.3); pointer-events: none; }
.pcard .pc-new ~ .pc-key, .pcard:has(.pc-new) .pc-key { display: none; }
.pc-top { display: flex; align-items: baseline; justify-content: space-between; }
.pc-r { font-family: var(--f-display); font-size: 2.1rem; line-height: 1; }
.pc-pos { font-family: var(--f-display); font-size: var(--s-sm); background: #141a3d; color: #fff; padding: 1px 6px; border-radius: 3px; }
.pc-name { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.1; margin-top: 4px; overflow-wrap: anywhere; }
.pc-full { font-size: var(--s-xs); font-weight: 700; line-height: 1.25; }
.pc-alt { font-size: var(--s-xs); opacity: .75; line-height: 1.25; }
.pc-nat { font-size: var(--s-sm); font-weight: 700; margin-top: 2px; }
.pc-tech { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; padding-top: 6px; }
.pc-tech span { font-size: .66rem; font-weight: 900; padding: 1px 5px; background: rgba(20, 26, 61, .14); border-radius: 3px; line-height: 1.35; }
.pc-bond { font-size: .7rem; font-weight: 900; background: #141a3d; color: var(--gold); padding: 3px 6px; border-radius: 3px; margin-top: 4px; line-height: 1.3; }

/* capitán */
.cap-list { display: flex; flex-direction: column; gap: 6px; }
.cap-row { display: grid; grid-template-columns: 40px 42px 1fr auto auto; align-items: center; gap: 8px; padding: 6px 10px; border: 2px solid rgba(232, 236, 255, .25); background: #0b1245; border-radius: 4px; cursor: pointer; text-align: left; }
.cap-row.sel { border-color: var(--gold); background: rgba(255, 201, 60, .14); }
.cr-r { font-family: var(--f-display); color: #141a3d; text-align: center; border-radius: 3px; padding: 2px 0; }
.cr-pos { font-size: var(--s-xs); color: var(--muted); font-weight: 900; }
.cr-n { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-c { font-size: var(--s-xs); background: var(--gold); color: var(--gold-ink); font-weight: 900; padding: 1px 6px; border-radius: 3px; }

/* ---------- Mundial ---------- */
.team-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 6px; }
.ts-name { font-family: var(--f-display); font-size: var(--s-lg); margin-right: auto; overflow-wrap: anywhere; }
.ts-stat { font-size: var(--s-sm); color: var(--muted); }
.ts-stat b { color: var(--gold); font-family: var(--f-display); font-weight: 400; font-size: var(--s-md); }
.tabs { display: flex; gap: 6px; border-bottom: 3px solid rgba(232, 236, 255, .3); }
.tab { padding: 8px 14px; border: 0; background: none; cursor: pointer; font-weight: 900; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -3px; }
.tab.sel { color: var(--gold); border-bottom-color: var(--gold); }
.tabpanel { display: flex; flex-direction: column; gap: 16px; }
.next-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 16px 0 6px; text-align: center; }
.vs-side { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.vs-side b { font-family: var(--f-display); font-weight: 400; font-size: var(--s-lg); line-height: 1.15; overflow-wrap: anywhere; }
.vs-flag { font-size: 2.4rem; line-height: 1; }
.vs-ov { font-family: var(--f-display); color: var(--gold); }
.vs-x { font-family: var(--f-display); color: var(--crimson); font-size: var(--s-xl); transform: skewX(-8deg); }
.rival-xi { margin-top: 10px; }
.my-xi summary { cursor: pointer; font-weight: 700; font-size: var(--s-sm); color: var(--muted); padding: 4px 0; }
.my-xi[open] { display: grid; gap: 10px; }
.my-xi .pitch { max-width: 460px; }
.rival-xi summary { cursor: pointer; font-weight: 700; font-size: var(--s-sm); color: var(--muted); }
.rx { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rx-p { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 3px; color: #141a3d; font-size: var(--s-xs); font-weight: 900; }
.rx-p i { font-style: normal; font-family: var(--f-display); background: #141a3d; color: #fff; padding: 0 4px; border-radius: 2px; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.path-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: center; padding: 8px 12px; background: #0b1245; border-left: 5px solid var(--muted); border-radius: 3px; font-size: var(--s-sm); }
.path-row.w { border-left-color: var(--good); }
.path-row.d { border-left-color: var(--gold); }
.path-row.l { border-left-color: var(--crimson); }
.pr-st { color: var(--muted); }
.pr-sc { font-family: var(--f-display); white-space: nowrap; }
.pr-sc small { font-family: var(--f-body); color: var(--muted); }
.groups { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.gt .lbl { margin-top: 0; }
.table { width: 100%; border-collapse: collapse; font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
.table th, .table td { padding: 6px 6px; border-bottom: 1px solid rgba(232, 236, 255, .14); text-align: center; }
.table thead th { color: var(--muted); font-size: var(--s-xs); font-weight: 700; }
.table tbody th { text-align: left; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.table tr.me th, .table tr.me td { color: var(--gold); }
.table tr.q th::after { content: " ✓"; color: var(--good); }
.table tr.out { opacity: .55; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: center; overflow-x: auto; }
.br-col { display: flex; flex-direction: column; gap: 8px; min-width: 150px; }
.br-col .lbl { margin: 0 0 2px; }
.br-m { display: flex; flex-direction: column; background: #0b1245; border: 2px solid rgba(232, 236, 255, .25); border-radius: 4px; font-size: var(--s-sm); }
.br-m span { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; white-space: nowrap; overflow: hidden; }
.br-m span + span { border-top: 1px solid rgba(232, 236, 255, .15); }
.br-m span.win { font-weight: 900; }
.br-m span.me { color: var(--gold); }
.br-m b { font-family: var(--f-display); font-weight: 400; }
.champ-line { font-family: var(--f-display); color: var(--gold); text-align: center; font-size: var(--s-lg); margin: 4px 0 0; }
.surv-streak { display: flex; align-items: baseline; gap: 10px; }
.surv-streak b { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; color: var(--gold); }
.surv-streak small { color: var(--muted); margin-left: auto; }

/* ---------- partido ---------- */
.match-screen { display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.scoreboard {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  padding: 12px; background: #070b26; border: 3px solid var(--rim); border-radius: 6px; box-shadow: inset 0 0 0 3px #0a1142;
}
.sb-team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sb-team.right { flex-direction: row-reverse; text-align: right; }
.sb-flag { font-size: 1.8rem; line-height: 1; }
.sb-name { font-family: var(--f-display); font-size: clamp(.85rem, 2.6vw, 1.15rem); line-height: 1.1; overflow-wrap: anywhere; min-width: 0; }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sb-score { font-family: var(--f-display); font-size: clamp(2rem, 8vw, 3rem); line-height: 1; display: flex; gap: 10px; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 12px rgba(255, 201, 60, .45); }
.sb-score i { font-style: normal; color: var(--muted); }
.sb-clock { display: flex; gap: 6px; align-items: center; font-family: var(--f-pixel); }
.sb-clock #clock { background: var(--crimson); color: #fff; padding: 0 8px; border-radius: 3px; min-width: 46px; text-align: center; }
.sb-clock #phase { color: var(--muted); font-size: var(--s-sm); }
.sb-pens { font-family: var(--f-pixel); color: var(--gold); font-size: var(--s-sm); }
.stage-line { text-align: center; }
.mini-pitch {
  position: relative; height: 70px; border-radius: 5px; border: 3px solid var(--rim); overflow: hidden;
  background: repeating-linear-gradient(90deg, var(--grass) 0 10%, var(--grass-2) 10% 20%);
}
.mp-half { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(255, 255, 255, .5); }
.mp-half::after { content: ""; position: absolute; left: -18px; top: 50%; width: 32px; height: 32px; margin-top: -16px; border: 2px solid rgba(255, 255, 255, .5); border-radius: 50%; }
.mp-box { position: absolute; top: 18%; bottom: 18%; width: 9%; border: 2px solid rgba(255, 255, 255, .5); }
.mp-box.l { left: -2px; } .mp-box.r { right: -2px; }
.mp-ball {
  position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 40%, #d0d6ff 41% 60%, #222 61% 66%, #fff 67%);
  box-shadow: 0 0 10px #fff; transition: left .35s ease;
}
.pitch-cv { display: block; width: 100%; border: 3px solid var(--rim); border-radius: 5px; image-rendering: pixelated; background: #2b8a3c; box-shadow: 0 6px 0 rgba(0, 0, 0, .35); }
.momentum { height: 8px; border-radius: 4px; background: var(--crimson); overflow: hidden; }
.mom-a { height: 100%; width: 50%; background: var(--gold); transition: width .4s ease; }
.match-ctrl { display: flex; flex-direction: column; gap: 8px; }
.mc-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.feed { height: 300px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-pixel); font-size: .95rem; line-height: 1.45; }
.fl { display: grid; grid-template-columns: 42px 1fr; gap: 8px; animation: lineIn .25s ease both; }
.fl > .fl-txt:only-child { grid-column: 1 / -1; }
.fl-min { color: var(--gold); text-align: right; }
.fl-txt { min-width: 0; overflow-wrap: anywhere; }
.fl-txt b { color: #fff; font-weight: 400; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .35); text-underline-offset: 3px; }
.fl-txt em { font-style: normal; color: var(--gold); }
.fl.goal.me { background: rgba(255, 201, 60, .16); margin: 0 -6px; padding: 4px 6px; border-radius: 3px; }
.fl.goal.me .fl-txt b { color: var(--gold); }
.fl.opp .fl-txt { color: #ffb1b8; }
.fl.goal.opp { background: rgba(224, 48, 63, .14); margin: 0 -6px; padding: 4px 6px; border-radius: 3px; }
.fl.build { opacity: .78; font-size: .94em; }
.fl.build .fl-min { visibility: hidden; }
.fl.build em { color: #9fe3ff; }
.fl.good .fl-txt { color: #c6f5d9; }
.fl.post .fl-txt { color: #ffe3a0; }
.fl.dim { opacity: .7; }
.fl.sys .fl-txt { color: var(--muted); }
.tally { color: var(--gold); margin-left: 6px; }
@keyframes lineIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.summary { display: flex; flex-direction: column; gap: 10px; animation: lineIn .3s ease both; }
.table.stats td { font-family: var(--f-display); font-size: var(--s-lg); width: 30%; }
.table.stats th { text-align: center; color: var(--muted); font-weight: 700; }
.sum-sc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: var(--s-sm); }
.sum-sc small { color: var(--muted); font-weight: 700; }
.sum-sc p { margin: 2px 0 0; }
.mvp { margin: 0; text-align: center; }
.mvp b { color: var(--gold); }

/* ---------- final ---------- */
.end { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 720px; margin: 0 auto; width: 100%; }
.end-badge svg { width: 120px; height: 140px; filter: drop-shadow(0 0 24px rgba(255, 201, 60, .55)); animation: rise .8s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes rise { from { transform: translateY(30px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.end-ball { display: block; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 38%, #cfd6ff 39% 58%, #2b335f 59% 64%, #fff 65%); opacity: .7; }
.end-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1.05; text-shadow: 4px 4px 0 var(--crimson); transform: skewX(-6deg); }
.end.out .end-title { text-shadow: 4px 4px 0 #0a1142; color: #ffd0d4; }
.end-sub { margin: 0; color: var(--muted); max-width: 34em; }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.end-stats div { background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 4px; padding: 8px; }
.end-stats b { display: block; font-family: var(--f-display); font-weight: 400; font-size: var(--s-xl); color: var(--gold); line-height: 1.15; overflow-wrap: anywhere; }
.end-stats span { font-size: var(--s-xs); color: var(--muted); }
.end-lines { margin: 0; font-size: 1.05rem; }
.share { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.share .lbl { margin: 0; }
.share img { width: 100%; max-width: 420px; height: auto; align-self: center; border: 3px solid var(--rim); border-radius: 4px; }
.share-text { width: 100%; font-family: var(--f-pixel); font-size: var(--s-sm); color: var(--text); background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 4px; padding: 8px; resize: vertical; }

/* ---------- álbum y récords ---------- */
.progress { position: relative; height: 30px; background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--grass), var(--good)); }
.progress span { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--s-sm); font-weight: 900; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.album-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.acard { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 8px; border-radius: 6px; color: #141a3d; border: 2px solid #0a1142; min-height: 104px; }
.acard.missing { background: repeating-linear-gradient(45deg, #1a2363 0 8px, #172057 8px 16px); color: var(--muted); border-style: dashed; border-color: rgba(232, 236, 255, .35); }
.ac-r { font-family: var(--f-display); font-size: 1.3rem; line-height: 1; }
.ac-pos { position: absolute; top: 8px; right: 8px; font-size: var(--s-xs); font-weight: 900; }
.ac-n { font-weight: 900; font-size: var(--s-sm); line-height: 1.2; overflow-wrap: anywhere; }
.ac-f { font-size: .9rem; }
.ac-t { font-size: .68rem; font-weight: 700; opacity: .8; margin-top: auto; }
.rec-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.rc { background: #0b1245; border: 2px solid rgba(232, 236, 255, .3); border-radius: 4px; padding: 10px; }
.rc b { display: block; font-family: var(--f-display); font-weight: 400; font-size: var(--s-xl); color: var(--gold); line-height: 1.1; font-variant-numeric: tabular-nums; }
.rc span { font-size: var(--s-xs); color: var(--muted); }
.ach-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.ach { padding: 10px 12px; border: 2px dashed rgba(232, 236, 255, .25); border-radius: 4px; opacity: .55; }
.ach b { display: block; }
.ach span { font-size: var(--s-sm); color: var(--muted); }
.ach.on { opacity: 1; border: 2px solid var(--gold); background: rgba(255, 201, 60, .1); }
.ach.on b::before { content: "★ "; color: var(--gold); }
.top-sc, .hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--s-sm); }
.top-sc li { display: flex; justify-content: space-between; padding: 6px 10px; background: #0b1245; border-radius: 3px; }
.top-sc b { font-family: var(--f-display); color: var(--gold); }
.hist li { display: grid; grid-template-columns: 92px 1fr auto 46px auto; gap: 10px; padding: 6px 10px; background: #0b1245; border-radius: 3px; align-items: center; }
.hist li span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .hist li { grid-template-columns: 1fr auto; } .hist li span:nth-child(1), .hist li span:nth-child(3) { display: none; } }

/* ---------- modal y toasts ---------- */
#modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.modal-back { position: absolute; inset: 0; background: rgba(5, 8, 30, .75); }
.modal-box { position: relative; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.modal-box .btn.primary { margin-top: 16px; }
.how { padding-left: 1.3em; display: flex; flex-direction: column; gap: 10px; }
.danger { margin-top: 16px; padding-top: 12px; border-top: 2px solid rgba(232, 236, 255, .2); }
.danger p { margin: 0 0 8px; font-size: var(--s-sm); }
#toasts { position: fixed; z-index: 65; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: var(--window); border: 3px solid var(--rim); color: var(--text); padding: 8px 14px; border-radius: 4px; font-weight: 700; font-size: var(--s-sm); box-shadow: 0 4px 0 rgba(0, 0, 0, .4); animation: lineIn .2s ease both; text-align: center; }
.toast.gold { background: var(--gold); color: var(--gold-ink); border-color: #fff3c4; }
.toast.out { opacity: 0; transition: opacity .35s; }
@media (min-width: 761px) { #toasts { top: auto; bottom: 24px; left: auto; right: 24px; transform: none; align-items: flex-end; width: 360px; flex-direction: column-reverse; } }

/* ---------- efectos: viñeta de supertiro ---------- */
#fx-layer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.cutin { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
.cutin-lines {
  position: absolute; inset: -40%;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, .85) 0deg 1.4deg, transparent 1.4deg 6deg);
  -webkit-mask: radial-gradient(circle, transparent 0 22%, #000 48%);
          mask: radial-gradient(circle, transparent 0 22%, #000 48%);
  animation: lines .9s linear infinite, fadein .15s ease both;
}
.cutin-opp .cutin-lines { background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 170, 178, .7) 0deg 1.4deg, transparent 1.4deg 6deg); }
@keyframes lines { to { transform: rotate(6deg); } }
@keyframes fadein { from { opacity: 0; } }
.cutin-band {
  position: relative; width: 130%; transform: skewY(-7deg);
  background: linear-gradient(90deg, #0a1142, var(--window) 30%, var(--window) 70%, #0a1142);
  border-block: 6px solid #fff; padding: 18px 0 20px;
  animation: bandIn .28s cubic-bezier(.2, .9, .3, 1.1) both;
  box-shadow: 0 0 0 6px rgba(0, 0, 0, .5);
}
.cutin-opp .cutin-band { background: linear-gradient(90deg, #2a0710, #7c1220 30%, #7c1220 70%, #2a0710); }
.cutin-save .cutin-band, .cutin-def .cutin-band { border-color: var(--gold); }
.cutin-inner { transform: skewY(7deg); text-align: center; padding: 0 18%; }
.cutin-sprites { position: absolute; left: 14%; bottom: -6px; display: flex; align-items: flex-end; transform: skewY(7deg); animation: spriteIn .35s .05s cubic-bezier(.2, .9, .3, 1.2) both; pointer-events: none; }
.cutin-sprite { width: clamp(64px, 11vw, 120px); height: auto; image-rendering: pixelated; filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, .55)); }
.cutin-sprite.s1, .cutin-sprite.s2 { width: clamp(48px, 8vw, 90px); margin-left: -10px; opacity: .92; }
.cutin-opp .cutin-sprites { left: auto; right: 14%; transform: skewY(7deg) scaleX(-1); }
@keyframes spriteIn { from { opacity: 0; translate: -60px 0; } to { opacity: 1; translate: 0 0; } }
@media (max-width: 560px) { .cutin-sprites { left: 4%; bottom: auto; top: -54px; } .cutin-opp .cutin-sprites { right: 4%; } }
.cutin-who { font-weight: 900; font-size: clamp(1rem, 3.4vw, 1.5rem); color: #fff; letter-spacing: .02em; animation: slam .3s .08s cubic-bezier(.2, .9, .3, 1.3) both; }
.cutin-tech {
  font-family: var(--f-display); font-size: clamp(1.9rem, 8vw, 4.6rem); line-height: 1.02; color: var(--gold);
  text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  transform: skewX(-8deg); animation: slam .35s .14s cubic-bezier(.2, .9, .3, 1.4) both;
}
.cutin-opp .cutin-tech { color: #fff; text-shadow: 4px 4px 0 var(--crimson), -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
.cutin-sub { font-family: var(--f-pixel); color: rgba(255, 255, 255, .8); margin-top: 6px; animation: fadein .3s .3s both; }
@keyframes bandIn { from { transform: skewY(-7deg) translateX(-100%); } to { transform: skewY(-7deg) translateX(0); } }
@keyframes slam { from { opacity: 0; transform: scale(2.2) skewX(-8deg); } to { opacity: 1; transform: scale(1) skewX(-8deg); } }
.cutin.out .cutin-band { animation: bandOut .25s ease-in both; }
.cutin.out .cutin-lines { opacity: 0; transition: opacity .2s; }
@keyframes bandOut { to { transform: skewY(-7deg) translateX(100%); opacity: .3; } }

.goalfx { position: absolute; inset: 0; display: grid; place-items: center; }
.goalfx-flash { position: absolute; inset: 0; background: #fff; animation: flash .35s ease-out both; }
.goalfx.theirs .goalfx-flash { background: var(--crimson); }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }
.goalfx-word {
  position: relative; font-family: var(--f-display); font-size: clamp(3rem, 16vw, 9rem); line-height: 1; color: var(--gold);
  -webkit-text-stroke: 3px #000; text-shadow: 8px 8px 0 var(--crimson), 0 0 40px rgba(255, 201, 60, .6);
  transform: skewX(-8deg); animation: goalIn .5s cubic-bezier(.2, .9, .3, 1.5) both;
}
.goalfx.theirs .goalfx-word { font-size: clamp(2rem, 9vw, 4.5rem); color: #fff; text-shadow: 5px 5px 0 var(--crimson); }
@keyframes goalIn { from { transform: scale(3) skewX(-8deg) rotate(-8deg); opacity: 0; } to { transform: scale(1) skewX(-8deg); opacity: 1; } }
.goalfx.out { opacity: 0; transition: opacity .25s; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
#app.shake { animation: shake .45s ease; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
@keyframes pulse { 50% { opacity: .55; } }

.foot { margin-top: 36px; padding-top: 16px; border-top: 2px solid rgba(232, 236, 255, .15); color: var(--muted); font-size: var(--s-xs); text-align: center; }
.foot a { color: var(--muted); }

/* ---------- responsive ---------- */
@media (max-width: 560px) {
  .form-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot { width: 60px; min-height: 68px; }
  .slot-n { max-width: 56px; font-size: .62rem; }
  .linebar { grid-template-columns: repeat(3, 1fr); }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .pcard { min-height: 190px; }
  .pc-r { font-size: 1.8rem; }
  .seg3 { grid-template-columns: 1fr; }

    if (this.score[0] !== this.score[1]) return this.score[0] > this.score[1] ? 0 : 1;
    if (this.pens) return this.pens[0] > this.pens[1] ? 0 : 1;
    return -1; // empate
  };

  P.mvp = function () {
    let best = null, bestV = -1;
    const w = this.winner();
    for (const [s, T] of this.T.entries()) {
      for (const sl of T.slots) {
        const pf = this.perf[sl.player.id] || { g: 0, a: 0, sv: 0, def: 0, dr: 0 };
        let v = 6 + pf.g * 1.3 + pf.a * 0.6 + pf.sv * 0.35 + pf.def * 0.3 + pf.dr * 0.15 + (sl.player.r - 80) * 0.02;
        if (w === s) v += 0.4;
        if (sl.pos === "GK" && this.score[1 - s] === 0) v += 0.8;
        if (v > bestV) { bestV = v; best = { p: sl.player, side: s, v }; }
      }
    }
    return best;
  };

  CT.playQuick = function (A, B, opts) {
    const m = new CT.Match(A, B, opts);
    while (!m.done) m.step();
    return m;
  };

  /* ---------- Mundial (16 equipos: 4 grupos + cuadro) ---------- */
  CT.createWorldCup = function (user, rng, diffMod) {
    const taken = new Set(user.players.map((p) => p.id));
    // solo selecciones que siguen teniendo once completo después de quitar a los que fichaste
    const nats = rng.shuffle((CT.CUP_NATIONS || Object.keys(CT.NATIONS)).filter((n) => CT.canField(n, taken))).slice(0, 15);
    const teams = [user].concat(nats.map((n) => CT.nationTeam(n, diffMod, taken)));
    const byOv = teams.slice().sort((x, y) => y.ov - x.ov);
    const pots = [0, 1, 2, 3].map((k) => rng.shuffle(byOv.slice(k * 4, k * 4 + 4)));
    const groups = [0, 1, 2, 3].map((g) => ({ id: "ABCD"[g], teams: pots.map((pot) => pot[g]) }));
    groups.forEach((g) => { g.table = {}; g.teams.forEach((t) => (g.table[t.key] = { pj: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 })); });
    const PAIRS = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
    const stages = [];
    for (let md = 0; md < 3; md++) {
      const fx = [];
      for (const g of groups) for (const [i, j] of PAIRS[md]) fx.push({ group: g.id, a: g.teams[i], b: g.teams[j], knockout: false });
      stages.push({ id: "md" + (md + 1), fixtures: fx });
    }
    return { teams, groups, stages, stageIdx: 0, rng, diffMod, userOut: false, champion: null, ko: [] };
  };

  CT.sortTable = function (g, rng) {
    return g.teams.slice().sort((x, y) => {
      const a = g.table[x.key], b = g.table[y.key];
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf || (y.ov - x.ov);
    });
  };

  CT.recordResult = function (wc, fx, m) {
    fx.result = { score: m.score.slice(), pens: m.pens ? m.pens.slice() : null, winner: m.winner() };
    fx.match = m;
    if (!fx.knockout) {
      const g = wc.groups.find((gg) => gg.id === fx.group);
      const [ga, gb] = m.score;
      const A = g.table[fx.a.key], B = g.table[fx.b.key];
      A.pj++; B.pj++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
      if (ga > gb) { A.w++; B.l++; A.pts += 3; } else if (ga < gb) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
    }
  };

  // Tras jugar una fase, prepara la siguiente
  CT.advanceWorldCup = function (wc) {
    const st = wc.stages[wc.stageIdx];
    wc.stageIdx++;
    if (st.id === "md3") {
      const [A, B, C, D] = wc.groups.map((g) => CT.sortTable(g, wc.rng));
      wc.qualified = new Set([A, B, C, D].flatMap((t) => [t[0].key, t[1].key]));
      if (!wc.qualified.has(wc.teams[0].key)) wc.userOut = "group";
      wc.stages.push({ id: "qf", fixtures: [
        { a: A[0], b: B[1], knockout: true }, { a: C[0], b: D[1], knockout: true },
        { a: B[0], b: A[1], knockout: true }, { a: D[0], b: C[1], knockout: true }
      ] });
    } else if (st.id === "qf" || st.id === "sf") {
      const w = st.fixtures.map((f) => (f.result.winner === 0 ? f.a : f.b));
      const next = st.id === "qf"
        ? { id: "sf", fixtures: [{ a: w[0], b: w[1], knockout: true }, { a: w[2], b: w[3], knockout: true }] }
        : { id: "final", fixtures: [{ a: w[0], b: w[1], knockout: true }] };
      wc.stages.push(next);
    } else if (st.id === "final") {
      const f = st.fixtures[0];
      wc.champion = f.result.winner === 0 ? f.a : f.b;
    }
    if (st.knockoutCheck !== false && st.id !== "md1" && st.id !== "md2" && st.id !== "md3") {
      const uf = st.fixtures.find((f) => f.a.isUser || f.b.isUser);
      if (uf) {
        const userSide = uf.a.isUser ? 0 : 1;
        if (uf.result.winner !== userSide) wc.userOut = st.id;
      }
    }
  };

  CT.userFixture = function (wc) {
    const st = wc.stages[wc.stageIdx];
    return st ? st.fixtures.find((f) => f.a.isUser || f.b.isUser) || null : null;
  };

  // Juega todos los partidos de la fase actual que no sean del usuario
  CT.playOthers = function (wc) {
    const st = wc.stages[wc.stageIdx];
    for (const f of st.fixtures) {
      if (f.result || f.a.isUser || f.b.isUser) continue;
      const m = CT.playQuick(f.a, f.b, { rng: wc.rng, knockout: f.knockout });
      CT.recordResult(wc, f, m);
    }
  };

  /* ---------- Supervivencia ---------- */
  CT.survivalOpponent = function (rng, n, baseMod, lastKey, exclude) {
    const keys = (CT.CUP_NATIONS || Object.keys(CT.NATIONS)).filter((k) => k !== lastKey && CT.canField(k, exclude));
    // cuanto más avanzas, más probable que toque un gigante
    const nat = rng.weighted(keys, (k) => Math.pow(CT.nationStrength[k] - 74, 1 + n * 0.12));
    return CT.nationTeam(nat, baseMod + Math.min(9, n * 0.9), exclude);
  };

/* ==========================================================================
   Draft: modos, tiradas y fichajes
   ========================================================================== */
(function (root) {
  const CT = root.CT;

  CT.MODES = {
    classic:  { id: "classic",  picks: 5, rerolls: 3, blind: false, cup: "world" },
    daily:    { id: "daily",    picks: 5, rerolls: 1, blind: false, cup: "world", seeded: true, fixedDiff: "pro" },
    blind:    { id: "blind",    picks: 5, rerolls: 3, blind: true,  cup: "world" },
    hardcore: { id: "hardcore", picks: 3, rerolls: 0, blind: false, cup: "world" },
    survival: { id: "survival", picks: 5, rerolls: 3, blind: false, cup: "survival" }
  };
  CT.DREAM_CHANCE = 0.07;
  CT.DREAM_MIN = 88;

  CT.todayKey = function (d = new Date()) {
    const z = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  };
  // Número de reto diario (día 1 = 29 oct 2026, estreno de esta versión)
  CT.dailyNumber = function (key = CT.todayKey()) {
    const [y, m, d] = key.split("-").map(Number);
    const t = Date.UTC(y, m - 1, d), t0 = Date.UTC(2026, 9, 29);
    return Math.floor((t - t0) / 86400000) + 1;
  };

  CT.newDraft = function ({ mode, formation, seed, teamName, diff }) {
    const M = CT.MODES[mode];
    const rng = CT.makeRng(seed);
    if (M.seeded) formation = rng.pick(Object.keys(CT.FORMATIONS));
    const slots = [];
    CT.FORMATIONS[formation].forEach((row, ri) => row.forEach((pos) => slots.push({ pos, row: ri, player: null })));
    return {
      mode, M, formation, slots, seed, rng, teamName, diff: M.fixedDiff || diff,
      used: new Set(), rerolls: M.rerolls, history: [], current: null, captainId: null, rolls: 0
    };
  };

  CT.freeCats = function (d) {
    const c = {};
    d.slots.forEach((s) => { if (!s.player) c[s.pos] = (c[s.pos] || 0) + 1; });
    return c;
  };

  CT.rollDraft = function (d) {
    const fc = CT.freeCats(d);
    const pool = CT.PLAYERS.filter((p) => !d.used.has(p.id) && fc[p.pos] > 0);
    const rng = d.rng;
    const n = d.M.picks;
    let players, dream = false;
    const elite = pool.filter((p) => p.r >= CT.DREAM_MIN);
    if (elite.length >= 2 && rng() < CT.DREAM_CHANCE) {
      dream = true;
      players = rng.shuffle(elite).slice(0, n);
      if (players.length < n) {
        const rest = pool.filter((p) => p.r < CT.DREAM_MIN).sort((a, b) => b.r - a.r);
        players = players.concat(rest.slice(0, n - players.length));
      }
      players = rng.shuffle(players);
    } else {
      // muestreo ponderado: los secundarios (menos de 80) salen algo menos para que la plantilla ampliada no diluya las tiradas
      const left = pool.slice(); players = [];
      const w = (p) => (p.r >= 88 ? 1.1 : p.r >= 80 ? 1 : 0.7);
      while (players.length < n && left.length) { const p = rng.weighted(left, w); players.push(p); left.splice(left.indexOf(p), 1); }
    }
    d.rolls++;
    d.current = { players, dream };
    return d.current;
  };

  CT.pickPlayer = function (d, id) {
    const p = CT.BY_ID[id];
    if (!p || !d.current || !d.current.players.includes(p)) return false;
    const slot = d.slots.find((s) => !s.player && s.pos === p.pos);
    if (!slot) return false;
    slot.player = p;
    d.used.add(p.id);
    d.history.push({ id: p.id, options: d.current.players.map((x) => x.id), dream: d.current.dream });
    d.current = null;
    return true;
  };

  CT.draftComplete = (d) => d.slots.every((s) => s.player);

  // Qué vínculos activaría fichar a p con el once actual
  CT.bondsIfPicked = function (d, p) {
    const now = new Set(CT.activeBonds(d.slots.filter((s) => s.player).map((s) => s.player)).map((b) => b.id));
    const after = CT.activeBonds(d.slots.filter((s) => s.player).map((s) => s.player).concat([p]));
    return after.filter((b) => !now.has(b.id) && b.members.includes(p.names.orig));
  };
})(typeof window !== "undefined" ? window : globalThis);

    try {
      if (!ac) {

    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.3, when = 0, freq = 1200, q = 0.7, swell = false) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + when;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);

/* ---- 06b-sprites.js ---- */
/* ==========================================================================
   Sprites pixel art genéricos (sin parecido con ningún personaje):

   ========================================================================== */
(function (root) {
  const CT = root.CT;

  const HAIR = ["#1b120c", "#2c1d14", "#4a2f1d", "#6d4526", "#0e0e12", "#8a5a2b", "#3a3a40"];
  const SKIN = ["#f3cfa8", "#e6b48a", "#c98f62", "#9b6440", "#704325"];
  const GK_KIT = ["#2f9e44", "#141414"];

  // . vacío · H pelo · S piel · J camiseta · K detalle camiseta · P pantalón · L medias · B botas · W blanco
  const BODY = [
    "...HHHH...",
    "..HHHHHH..",
    "..HSSSSH..",
    "..SSSSSS..",
    "...SSSS...",
    "..JJKKJJ..",
    ".JJJJJJJJ.",
    "SJJJJJJJJS",
    "S.JJJJJJ.S",
    "..PPPPPP.."
  ];
  const LEGS = {
    run1: ["..PP..PP..", "..LL...L..", "..BB...LB.", "........B."],
    run2: ["..PP..PP..", "..L...LL..", ".BL...BB..", ".B........"],
    stand: ["..PP..PP..", "..LL..LL..", "..LL..LL..", ".BBB..BBB."],

    const h = CT.hashStr(p ? p.id : nat || "x");
    const N = CT.NATIONS[nat] || { kit: ["#ffffff", "#1d3fbf"] };
    const kit = isGK ? GK_KIT : N.kit;
    return {
      hair: pick(HAIR, h), skin: pick(SKIN, h >>> 5),
      shirt: kit[0], trim: kit[1], shorts: kit[1] === "#ffffff" && kit[0] === "#ffffff" ? "#1d3fbf" : kit[1],
      socks: kit[0]
    };

  CT.drawSprite = function (g, x, y, look, pose = "stand", s = 2, flip = false) {
    const rows = BODY.concat(LEGS[pose] || LEGS.stand);
    const w = 10, h = rows.length;

      for (let c = 0; c < w; c++) {
        const ch = line[flip ? w - 1 - c : c];
        if (ch === "." || !col[ch]) continue;

      if (def) { def.goto = { x: bx, y: by, rate: 12 }; await this.arrive(def, 260); }
      if (shooter) shooter.kickUntil = performance.now() + 380 / this.speed;
      await this.tween(bx, by, 160, { trail: true, trailColor: power, ease: "lin" });
      if (def) this.highlight(def.p, 1 - side, CT.pname(def.p, true));
      this.flash = performance.now() + 90;
      await this.tween(bx - d * 6, by + (Math.random() < 0.5 ? -14 : 14), 380, { arc: 6 });
      if (def) def.goto = null;
      if (shooter) shooter.goto = null;
      return;
    }
    if (shooter) { shooter.kickUntil = performance.now() + 380 / this.speed; shooter.goto = null; }
    if (outcome === "goal") {
      gk.dive = { x: gx - d * 1.5, y: FH / 2 - (aimY - FH / 2) * 0.6 };
      await this.tween(gx + d * 1.6, aimY, fly, { trail: true, trailColor: power, ease: "lin", arc: air });
      this.net = { side: 1 - side, until: performance.now() + 900 };
      this.flash = performance.now() + 220;

    } else if (outcome === "save") {
      const catchX = gx - d * 2.2;
      gk.dive = { x: catchX, y: aimY };
      await this.tween(catchX, aimY, fly, { trail: true, trailColor: power, ease: "lin", arc: air });

    const att = this.byPlayer(attP, side), def = this.byPlayer(defP, 1 - side);

    this.owner = side; this.chaser = null;
    const start = { x: CT.clamp(att.x, 25, 80), y: CT.clamp(att.y, 8, 60) };
    if (side === 1) start.x = CT.clamp(att.x, 25, 80);
    await this.tween(start.x, start.y, 380, { carrier: att });
    const meet = { x: start.x + d * 6, y: start.y };
    def.goto = { x: meet.x + d * 1.2, y: meet.y, rate: 7 };
    await this.tween(meet.x, meet.y, 380, { carrier: att });
    if (won) {
      this.highlight(att.p, side, CT.pname(att.p, true));
      const sw = meet.y < FH / 2 ? 5 : -5;
      await this.tween(meet.x + d * 4, meet.y + sw, 260, { carrier: att, trail: true, trailColor: "#9fe3ff" });
      def.goto = { x: meet.x, y: meet.y - sw * 0.3, rate: 2 };
      await this.tween(meet.x + d * 11, meet.y + sw, 420, { carrier: att });
    } else {
      this.highlight(def.p, 1 - side, CT.pname(def.p, true));
      this.flash = performance.now() + 80;
      this.owner = 1 - side;
      await this.tween(def.x, def.y, 200, { carrier: def });
      await this.tween(def.x - d * 7, def.y + (Math.random() - 0.5) * 8, 420, { carrier: def });
    }

  };

  // Penalti desde el punto de 11 metros
  P.penalty = async function (side, ok, taker) {
    const d = side === 0 ? 1 : -1, gx = side === 0 ? FW : 0;
    const spotX = gx - d * 11;
    const shooter = this.byPlayer(taker, side) || this.nearest(side, spotX, FH / 2);
    const gk = this.teamPlayers(1 - side).find((q) => q.isGK) || this.teamPlayers(1 - side)[0];
    this.ball.anim = null; this.ball.trail = [];
    this.ball.x = spotX; this.ball.y = FH / 2;
    shooter.x = spotX - d * 3; shooter.y = FH / 2 + 1;
    gk.x = gx - d * 0.8; gk.y = FH / 2; gk.dive = null;
    this.owner = side;
    this.highlight(shooter.p, side, CT.pname(shooter.p, true));

  P.draw = function (now) {

    const W = this.W, H = this.H;
    // césped a franjas
    for (let i = 0; i < 12; i++) {
      g.fillStyle = i % 2 ? "#2b8a3c" : "#33994a";
      g.fillRect((W * i) / 12, 0, W / 12 + 1, H);
    }

    g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2;
    const X = (x) => this.px(x), Y = (y) => this.py(y);
    g.strokeRect(X(0), Y(0), X(FW) - X(0), Y(FH) - Y(0));
    g.beginPath(); g.moveTo(X(FW / 2), Y(0)); g.lineTo(X(FW / 2), Y(FH)); g.stroke();

      g.strokeRect(Math.min(X(x0), X(x0 + d * 5.5)), Y(FH / 2 - 9.16), Math.abs(X(x0 + d * 5.5) - X(x0)), Y(FH / 2 + 9.16) - Y(FH / 2 - 9.16));
      // portería con red
      const shake = this.net.side === s && now < this.net.until ? Math.sin(now / 30) * 2.5 : 0;
      const gx = X(x0), gw = d * -2.4 * this.sx - d * Math.abs(shake);
      g.fillStyle = "rgba(255,255,255,.18)";
      g.fillRect(Math.min(gx, gx + gw), Y(FH / 2 - 3.66), Math.abs(gw), Y(FH / 2 + 3.66) - Y(FH / 2 - 3.66));
      g.strokeStyle = "#fff"; g.lineWidth = 2.5;
      g.strokeRect(Math.min(gx, gx + gw), Y(FH / 2 - 3.66), Math.abs(gw), Y(FH / 2 + 3.66) - Y(FH / 2 - 3.66));
      g.lineWidth = 2;
    }
    // estela del balón
    const b = this.ball;
    if (b.trail.length > 1) {
      g.strokeStyle = b.trailColor || "#ffffff";
      for (let i = 1; i < b.trail.length; i++) {
        g.globalAlpha = (i / b.trail.length) * 0.8; g.lineWidth = 1 + (i / b.trail.length) * 4;
        g.beginPath(); g.moveTo(X(b.trail[i - 1][0]), Y(b.trail[i - 1][1])); g.lineTo(X(b.trail[i][0]), Y(b.trail[i][1])); g.stroke();
      }
      g.globalAlpha = 1;
    }
    // jugadores ordenados por profundidad
    const sorted = this.players.slice().sort((a, c) => a.y - c.y);
    const hl = this.hl && now < this.hl.until ? this.hl : null;
    for (const q of sorted) {
      const x = X(q.x), y = Y(q.y);
      g.fillStyle = "rgba(0,0,0,.28)";
      g.beginPath(); g.ellipse(x, y, 5 * this.ps, 1.6 * this.ps, 0, 0, Math.PI * 2); g.fill();
      if (hl && hl.q === q) {
        g.strokeStyle = "#ffc93c"; g.lineWidth = 2;
        g.beginPath(); g.ellipse(x, y, 7.5 * this.ps, 2.8 * this.ps, 0, 0, Math.PI * 2); g.stroke();
      }
      const pose = now < q.kickUntil ? "kick" : q.isGK && q.dive ? "kick" : q.moving ? (Math.floor(now / 140) % 2 ? "run1" : "run2") : "stand";

    }
    // balón
    const bx = X(b.x), by = Y(b.y);
    g.fillStyle = "rgba(0,0,0,.35)";
    g.beginPath(); g.ellipse(bx, by, 3.2, 1.4, 0, 0, Math.PI * 2); g.fill();
    const bz = b.z * this.sy;
    g.fillStyle = "#fff"; g.strokeStyle = "#111"; g.lineWidth = 1;
    g.beginPath(); g.arc(bx, by - 3 - bz, 3.4, 0, Math.PI * 2); g.fill(); g.stroke();
    // etiqueta del protagonista
    if (hl && hl.label) {
      g.font = "700 12px " + getComputedStyle(document.body).getPropertyValue("--f-body");
      const tw = g.measureText(hl.label).width + 10;
      // la etiqueta no se sale del campo por los lados ni por arriba
      const x = CT.clamp(X(hl.q.x), tw / 2 + 2, this.W - tw / 2 - 2), y = Math.max(16, Y(hl.q.y) - 15 * this.ps - 6);

  };

  function miniFormation(f) {

    rows.forEach((row, ri) => {

      row.forEach((_, ci) => { dots += `<circle cx="${(60 * (ci + 1)) / (row.length + 1)}" cy="${y}" r="4"/>`; });
    });
    return `<svg class="mini-form" viewBox="0 0 60 78" aria-hidden="true"><rect x="1" y="1" width="58" height="76" rx="3"/>${dots}</svg>`;

  Screens.cup = function () {
    if (S.run.mode === "survival") return survivalHub();
    const wc = S.wc;
    const tabs = ["path", "groups", "bracket"];
    return `
    ${teamHeader()}
    <div class="tabs" role="tablist">${tabs.map((x) => `<button role="tab" class="tab${S.cupTab === x ? " sel" : ""}" aria-selected="${S.cupTab === x}" data-act="cupTab" data-tab="${x}">${t("tab" + x[0].toUpperCase() + x.slice(1))}</button>`).join("")}</div>
    <div class="tabpanel">${S.cupTab === "path" ? cupPath(wc) : S.cupTab === "groups" ? cupGroups(wc) : cupBracket(wc)}</div>`;
  };

  function nextMatchCard(rival, stageTxt, rivalMod) {
    const xi = rival.slots.slice().sort((a, b) => CT.POS_ORDER.indexOf(b.pos) - CT.POS_ORDER.indexOf(a.pos));
    return `<div class="window next">
      <div class="next-head"><span class="tag">${stageTxt}</span><span class="muted small">${t("nextMatch")}</span></div>
      <div class="versus">
        <div class="vs-side"><span class="vs-flag">⭐</span><b>${esc(S.team.name)}</b><span class="vs-ov">${fmt(S.team.ov)}</span></div>
        <span class="vs-x">${t("vs")}</span>
        <div class="vs-side"><span class="vs-flag">${teamFlag(rival)}</span><b>${esc(CT.teamName(rival))}</b><span class="vs-ov">${fmt(rival.ov)}</span></div>
      </div>
      <details class="rival-xi"><summary>${t("rivalXI")} (${rival.formation})</summary>
        <div class="rx">${xi.map((s) => `<span class="rx-p ${rar(s.player.r)}"><i>${s.player.r}</i>${esc(CT.pname(s.player, true))}</span>`).join("")}</div>
      </details>
      <h3 class="lbl">${t("tactic")}</h3>
      ${tacticSeg(S.tactic, "preTactic")}
      <button class="btn primary big" data-act="play">${t("playMatch")}</button>
    </div>`;
  }
  function tacticSeg(cur, act) {
    return `<div class="seg3 tac">${["att", "bal", "def"].map((x) => `<button class="seg${x === cur ? " sel" : ""}" data-act="${act}" data-t="${x}" aria-pressed="${x === cur}"><b>${t("tac." + x)}</b><small>${t("tac." + x + ".d")}</small></button>`).join("")}</div>`;
  }

  function cupPath(wc) {
    const done = [];
    for (let i = 0; i < wc.stageIdx; i++) {
      const st = wc.stages[i];
      const f = st.fixtures.find((x) => x.a.isUser || x.b.isUser);
      if (f) done.push({ st, f });
    }
    const rows = done.map(({ st, f }) => {
      const us = f.a.isUser ? 0 : 1, them = us ? f.a : f.b;
      const gs = f.result.score[us], gc = f.result.score[1 - us];
      const w = f.result.winner === us ? "w" : f.result.winner === -1 ? "d" : "l";
      const pen = f.result.pens ? ` <small>(${f.result.pens[us]}-${f.result.pens[1 - us]} pen.)</small>` : "";
      return `<li class="path-row ${w}"><span class="pr-st">${stageLabel(st.id)}</span><span class="pr-vs">${teamFlag(them)} ${esc(CT.teamName(them))}</span><span class="pr-sc">${gs}-${gc}${pen}</span></li>`;
    }).join("");
    let next = "";
    const uf = CT.userFixture(wc);
    if (wc.champion || wc.userOut) {
      next = `<div class="btn-row">${!wc.champion ? `<button class="btn ghost" data-act="simRest">${t("simRest")}</button>` : ""}<button class="btn primary" data-act="toEnd">${t("continue")}</button></div>`;
    } else if (uf) {
      const rival = uf.a.isUser ? uf.b : uf.a;
      next = nextMatchCard(rival, stageLabel(wc.stages[wc.stageIdx].id));
    }
    return `${next}${rows ? `<ol class="path">${rows}</ol>` : ""}`;
  }

  function groupTable(g, wc) {
    const order = CT.sortTable(g);
    const finished = wc.stageIdx >= 3;
    return `<div class="gt"><h3 class="lbl">${t("group", { g: g.id })}</h3>
      <table class="table"><thead><tr><th scope="col"></th><th scope="col">${t("pj")}</th><th scope="col">${t("dg")}</th><th scope="col">${t("gf")}</th><th scope="col">${t("pts")}</th></tr></thead><tbody>
      ${order.map((tm, i) => { const r = g.table[tm.key]; return `<tr class="${tm.isUser ? "me" : ""} ${finished ? (i < 2 ? "q" : "out") : ""}"><th scope="row">${teamFlag(tm)} ${esc(CT.teamName(tm))}</th><td>${r.pj}</td><td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td><td>${r.gf}</td><td><b>${r.pts}</b></td></tr>`; }).join("")}
      </tbody></table></div>`;
  }
  function cupGroups(wc) { return `<div class="groups">${wc.groups.map((g) => groupTable(g, wc)).join("")}</div>`; }

  function cupBracket(wc) {
    const col = (id, n) => {
      const st = wc.stages.find((s) => s.id === id);
      const fx = st ? st.fixtures : Array.from({ length: n }, () => null);
      return `<div class="br-col"><h3 class="lbl">${stageLabel(id)}</h3>${fx.map((f) => {
        if (!f) return `<div class="br-m"><span>—</span><span>—</span></div>`;
        const r = f.result;
        const line = (tm, i) => `<span class="${tm.isUser ? "me" : ""} ${r && r.winner === i ? "win" : ""}">${teamFlag(tm)} ${esc(CT.teamName(tm))}<b>${r ? r.score[i] + (r.pens ? ` (${r.pens[i]})` : "") : ""}</b></span>`;
        return `<div class="br-m">${line(f.a, 0)}${line(f.b, 1)}</div>`;
      }).join("")}</div>`;
    };
    const champ = wc.champion ? `<p class="champ-line">🏆 ${t("worldChampion", { t: esc(CT.teamName(wc.champion)) })}</p>` : "";
    return `<div class="bracket">${col("qf", 4)}${col("sf", 2)}${col("final", 1)}</div>${champ}`;
  }

  function survivalHub() {
    const sv = S.surv;
    const rows = sv.results.map((r, i) => `<li class="path-row ${r.w}"><span class="pr-st">${t("stage.surv", { n: i + 1 })}</span><span class="pr-vs">${flag(r.nat)} ${esc(CT.natName(r.nat))}</span><span class="pr-sc">${r.gs}-${r.gc}${r.pens ? ` <small>(${r.pens} pen.)</small>` : ""}</span></li>`).reverse().join("");
    return `${teamHeader()}
      <div class="surv-streak"><b>${sv.wins}</b><span>${t("streak")}</span><small>${t("st.best")}: ${CT.stats.bestSurv}</small></div>
      ${nextMatchCard(sv.next, t("stage.surv", { n: sv.results.length + 1 }))}
      ${rows ? `<ol class="path">${rows}</ol>` : ""}`;
  }

  /* ------------------------------------------------------------ partido */
  Screens.match = function () {

  /* Narración */
  function say(ev, m, userSide) {
    const C = CT.COMMENTARY[CT.settings.lang] || CT.COMMENTARY.es;
    const pick = (arr) => (Array.isArray(arr) ? arr[Math.floor(Math.random() * arr.length)] : arr);
    const B = (p) => `<b>${esc(CT.pname(p, true))}</b>`;
    const T = (id) => `<em>${esc(CT.tname(id))}</em>`;
    // técnicas con exclamación propia («¡Que me dé en algún sitio!») no duplican los signos de la plantilla
    const fill = (s, v) => s.replace(/\{(\w+)\}/g, (x, k) => (v[k] !== undefined ? v[k] : x)).replace(/¡(<[^>]*>)?¡/g, "¡$1").replace(/!(<\/[^>]*>)?!/g, "$1!");
    const team = (s) => esc(CT.teamName(m.T[s]));
    const scoreTxt = () => `${team(0)} ${m.score[0]}-${m.score[1]} ${team(1)}`;
    const mine = ev.side === userSide;
    switch (ev.type) {
      case "goal": {
        let s;
        if (ev.combo) s = fill(pick(C.goalCombo), { p: B(ev.p), partners: CT.joinNames(ev.partners.map(B)), tech: T(ev.tech) });
        else if (mine) s = ev.tech ? fill(pick(C.goalTech), { p: B(ev.p), tech: T(ev.tech) }) : fill(pick(C.goal), { p: B(ev.p) });
        else s = ev.tech ? fill(pick(C.oppGoalTech), { p: B(ev.p), tech: T(ev.tech), team: team(ev.side) }) : fill(pick(C.oppGoal), { p: B(ev.p), team: team(ev.side) });
        if (ev.assist && !ev.combo) s += " " + fill(C.assist, { a: B(ev.assist) });
        return { cls: mine ? "goal me" : "goal opp", txt: "⚽ " + s };
      }
      case "save": {
        const shotT = ev.shotTech ? T(ev.shotTech) : CT.settings.lang === "ja" ? "シュート" : CT.settings.lang === "en" ? "shot" : "disparo";
        const v = { shooter: B(ev.shooter), shotTech: shotT, gk: B(ev.p), tech: ev.tech ? T(ev.tech) : "" };
        const txt = ev.parry ? fill(pick(ev.tech ? C.savePunch : C.savePunchPlain), v) : fill(pick(ev.tech ? C.saveTech : C.save), v);
        return { cls: ev.side === userSide ? "good" : "", txt: (ev.parry ? "👊 " : "🧤 ") + txt };
      }
      case "block":
        return { cls: ev.side === userSide ? "good" : "", txt: "🛡️ " + (ev.tech ? fill(pick(C.blockTech), { d: B(ev.p), shooter: B(ev.shooter), tech: T(ev.tech) }) : fill(pick(C.block), { d: B(ev.p), shooter: B(ev.shooter) })) };
      case "post":
        return { cls: "post", txt: "😱 " + (ev.tech ? fill(pick(C.post), { p: B(ev.p), tech: T(ev.tech) }) : fill(pick(C.postPlain), { p: B(ev.p) })) };
      case "wide":
        return { cls: "dim", txt: "↗ " + (ev.tech ? fill(pick(C.wide), { p: B(ev.p), tech: T(ev.tech) }) : fill(pick(C.widePlain), { p: B(ev.p) })) };
      case "drib":
        return { cls: mine ? "good" : "", txt: "💨 " + (ev.victim ? fill(pick(C.dribPast), { p: B(ev.p), victim: B(ev.victim), tech: T(ev.tech) }) : fill(pick(CT.TECH[ev.tech].type === "pass" ? C.pass : C.drib), { p: B(ev.p), tech: T(ev.tech) })) };
      case "tackle":
        return { cls: ev.side === userSide ? "good" : "", txt: "⚔️ " + (ev.vtech ? fill(pick(C.tackleDuel), { d: B(ev.p), victim: B(ev.victim), tech: T(ev.tech), vtech: T(ev.vtech) }) : fill(pick(C.tackle), { d: B(ev.p), victim: B(ev.victim), tech: T(ev.tech) })) };
      case "half": return { cls: "sys", txt: fill(C.half, { score: scoreTxt() }) };
      case "et": return { cls: "sys", txt: C.et };
      case "ethalf": return { cls: "sys", txt: fill(C.ethalf, { score: scoreTxt() }) };
      case "pens": return { cls: "sys", txt: C.pens };
      case "end": return { cls: "sys", txt: "🏁 " + fill(C.end, { score: scoreTxt() + (m.pens ? ` (${m.pens[0]}-${m.pens[1]} pen.)` : "") }) };
      case "pen":
        return { cls: ev.ok ? (mine ? "goal me" : "opp") : (mine ? "opp" : "good"), txt: (ev.ok ? "✅ " : "❌ ") + (ev.ok ? fill(C.penOk, { p: B(ev.p) }) : ev.tech ? fill(C.penMissTech, { p: B(ev.p), gk: B(ev.gk), tech: T(ev.tech) }) : fill(C.penMiss, { p: B(ev.p), gk: B(ev.gk) })) + ` <span class="tally">${ev.tally[0]}-${ev.tally[1]}</span>` };
    }
    return null;
  }

  // Narración de la jugada previa a un remate
  function sayBuild(st, ev, userSide) {
    const C = CT.COMMENTARY[CT.settings.lang] || CT.COMMENTARY.es;
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const B = (p) => `<b>${esc(CT.pname(p, true))}</b>`;
    const T = (id) => `<em>${esc(CT.tname(id))}</em>`;
    const fill = (str, v) => str.replace(/\{(\w+)\}/g, (x, k) => (v[k] !== undefined ? v[k] : x)).replace(/¡(<[^>]*>)?¡/g, "¡$1").replace(/!(<\/[^>]*>)?!/g, "$1!");
    const shooter = ev.type === "save" || ev.type === "block" ? ev.shooter : ev.p;
    const v = { p: B(st.p), to: st.to ? B(st.to) : B(shooter), victim: st.victim ? B(st.victim) : "", tech: st.tech ? T(st.tech) : "" };
    const key = { pass: st.tech ? "bPassTech" : "bPass", cross: st.tech ? "bCrossTech" : "bCross", drib: st.tech ? "bDribTech" : "bDrib", long: "bLong", combo: "bCombo" }[st.k];
    if (!key || !C[key]) return null;
    const side = ev.type === "save" || ev.type === "block" ? 1 - ev.side : ev.side;
    return { cls: "build " + (side === userSide ? "mine" : ""), txt: "▸ " + fill(pick(C[key]), v) };
  }

  function startLive({ rival, knockout, stageTxt, onDone, seed }) {
    const rng = CT.makeRng(seed);
    const m = new CT.Match(S.team, rival, { rng, knockout, tacticA: S.tactic, tacticB: "bal" });
    if (S.live && S.live.pitch) S.live.pitch.stop();
    S.live = { m, stageTxt, onDone, skipping: false, lastCut: -20, running: true, pitch: null };
    S.screen = "match";
    render();
    CT.sfx.whistle();
    runLive();
  }

  async function runLive() {
    const L = S.live, m = L.m;
    const feed = $("#feed");
    const cv = $("#pitch-cv");
    if (cv && !L.pitch) { L.pitch = new CT.Pitch(cv, m.T[0], m.T[1]); L.pitch.speed = CT.settings.speed; L.pitch.start(); }
    const pitch = L.pitch;
    const addLine = (r, min) => {
      if (!r || !feed) return;
      const el = document.createElement("div");
      el.className = "fl " + r.cls;
      el.innerHTML = (min !== null ? `<span class="fl-min">${min}'</span>` : "") + `<span class="fl-txt">${r.txt}</span>`;
      feed.appendChild(el);
      feed.scrollTop = feed.scrollHeight;
    };
    const upd = () => {
      const a = $("#sc-a"), b = $("#sc-b");
      if (a) a.textContent = m.score[0];
      if (b) b.textContent = m.score[1];
      const c = $("#clock"); if (c) c.textContent = (m.phase === "PEN" || m.pens ? "120" : m.min) + "'";
      const ph = $("#phase");
      if (ph) ph.textContent = m.done ? t("fullTime") : m.phase === "PEN" ? t("penalties") : m.phase === "ET" ? t("extraTime") : t("live");
      const mom = $("#mom-a");
      const bx = pitch ? (pitch.ball.x / 105) * 100 : 50;
      if (mom) mom.style.width = CT.clamp(50 + (m.mom[0] - m.mom[1]) * 12 + (bx - 50) * 0.3, 8, 92) + "%";
    };
    const sp = () => CT.settings.speed;
    const live = () => !L.skipping && S.live === L;
    const tick = () => (L.skipping ? 0 : Math.max(10, 110 / sp()));
    const trailOf = (tech) => (tech && CT.TECH[tech] && (CT.TECH[tech].pow >= 4 || CT.TECH[tech].type === "combo") ? "#ffc93c" : "#ffffff");
    const isAir = (tech) => tech && ((CT.TECH[tech] && CT.TECH[tech].air) || /head|volley|overhead|skylab|sepak|lucha|cabez|volea|chilena/i.test(tech + " " + (CT.TECH[tech] ? CT.TECH[tech].en : "")));
    const cut = (opts) => CT.fx.cutin(Object.assign({ speed: sp() }, opts));

    while (!m.done) {
      if (!S.live || S.live !== L) return;
      if (pitch) pitch.speed = sp();
      const poss0 = m.stats.poss[0];
      const evs = m.step();
      const owner = m.stats.poss[0] > poss0 ? 0 : 1;
      if (pitch && live() && m.min % 2 === 0) pitch.flow(owner);
      for (const ev of evs) {
        if (ev.type === "pen") {
          const pe = $("#pens"); if (pe) { pe.hidden = false; pe.textContent = `${t("penalties")} ${ev.tally[0]}-${ev.tally[1]}`; }
          if (live()) {
            CT.sfx.kick();
            if (pitch) await pitch.penalty(ev.side, ev.ok, ev.p);
            if (ev.ok === false && ev.tech && CT.TECH[ev.tech].pow >= 4) await cut({ player: ev.gk, tech: ev.tech, side: ev.side === 0 ? "opp" : "me", kind: "save" });
          }
          addLine(say(ev, m, 0), null);
          continue;
        }
        const r = say(ev, m, 0);
        const shotTypes = { goal: 1, post: 1, wide: 1, save: 1, block: 1 };
        if (shotTypes[ev.type]) {
          // quién dispara, con qué técnica y cómo acaba
          const shootSide = ev.type === "save" || ev.type === "block" ? 1 - ev.side : ev.side;
          const shooter = ev.type === "save" || ev.type === "block" ? ev.shooter : ev.p;
          const tech = ev.type === "save" || ev.type === "block" ? ev.shotTech : ev.tech;
          // 1. la jugada previa, paso a paso (narración + campo)
          for (const st of ev.build || []) {
            addLine(sayBuild(st, ev, 0), ev.min);
            if (pitch && live()) await pitch.build(shootSide, st, shooter, ev.sit);
            if (st.tech && live() && st.k !== "combo" && CT.TECH[st.tech].pow >= 5 && sp() < 4 && m.min - L.lastCut >= 8 && st.p.r >= 88) {
              L.lastCut = m.min;
              await cut({ player: st.p, tech: st.tech, side: shootSide === 0 ? "me" : "opp", kind: st.k === "drib" ? "def" : "shot" });
            }
          }
          if (live()) {
            // 2. el rematador ya está en su sitio: viñeta del supertiro
            const big = tech && CT.TECH[tech] && (CT.TECH[tech].pow >= 4 || ev.combo);
            if (big && (ev.type === "goal" || sp() < 4)) await cut({ player: shooter, tech, side: shootSide === 0 ? "me" : "opp", kind: "shot", partners: ev.partners });
            // 3. el remate y la respuesta del rival
            if (pitch) await pitch.strike(shootSide, ev.type, shooter, { trailColor: trailOf(tech), air: isAir(tech), parry: ev.parry, blocker: ev.type === "block" ? ev.p : null });
            if ((ev.type === "save" || ev.type === "block") && ev.tech && CT.TECH[ev.tech].pow >= 4 && sp() < 4 && m.min - L.lastCut >= 5) {
              L.lastCut = m.min;
              await cut({ player: ev.p, tech: ev.tech, side: ev.side === 0 ? "me" : "opp", kind: ev.type === "save" ? "save" : "def" });
            }
          }
        } else if ((ev.type === "tackle" || ev.type === "drib") && live()) {
          // duelo en el centro del campo
          if (pitch) {
            if (ev.type === "drib" && ev.victim) await pitch.duel(ev.side, ev.p, ev.victim, true);
            else if (ev.type === "tackle") await pitch.duel(1 - ev.side, ev.victim, ev.p, false);
            else pitch.highlight(ev.p, ev.side, CT.pname(ev.p, true));
          }
          const big = ev.tech && CT.TECH[ev.tech] && CT.TECH[ev.tech].pow >= 4;
          if (big && sp() < 4 && m.min - L.lastCut >= 9 && ev.p.r >= 86) {
            L.lastCut = m.min;
            await cut({ player: ev.p, tech: ev.tech, side: ev.side === 0 ? "me" : "opp", kind: "def" });
          }
        }
        if (ev.type !== "end") addLine(r, ev.min);
        upd();
        if (ev.type === "goal") {
          if (live()) await CT.fx.goal({ mine: ev.side === 0, text: ev.side === 0 ? (CT.settings.lang === "ja" ? "ゴール!!" : CT.settings.lang === "en" ? "GOAL!" : "¡GOOOL!") : (CT.settings.lang === "ja" ? "失点" : CT.settings.lang === "en" ? "Goal against" : "Gol rival"), speed: sp() });
          if (pitch) pitch.kickoff();
        } else if (live()) {
          if (ev.type === "save") CT.sfx.save();
          if (ev.type === "post") CT.sfx.post();
          if (ev.type === "half" || ev.type === "et" || ev.type === "ethalf") { CT.sfx.whistle(); if (pitch) pitch.kickoff(); await CT.sleep(500 / sp()); }
          if (ev.type === "pens") { CT.sfx.whistle(); await CT.sleep(700 / sp()); }
        }
        if (ev.type === "end") addLine(r, null);
      }
      upd();
      const w = tick();
      if (w) await CT.sleep(w);
    }
    if (!L.skipping) CT.sfx.whistle(true);
    upd();
    const sk = $("#btn-skip"); if (sk) sk.disabled = true;
    L.running = false;
    showSummary();
  }

  function showSummary() {
    const L = S.live, m = L.m;
    const st = m.stats, A = m.T[0], B = m.T[1];
    const possA = Math.round((100 * st.poss[0]) / Math.max(1, st.poss[0] + st.poss[1]));
    const goals = m.events.filter((e) => e.type === "goal");
    const sc = (s) => goals.filter((g) => g.side === s).map((g) => `${esc(CT.pname(g.p, true))} ${g.min}'`).join(", ") || "—";
    const mvp = m.mvp();
    const row = (lbl, a, b) => `<tr><td>${a}</td><th scope="row">${lbl}</th><td>${b}</td></tr>`;
    const box = $("#post-match");
    if (!box) return;
    box.innerHTML = `<div class="window summary">
      <table class="table stats"><tbody>
        ${row(t("shots"), st.shots[0], st.shots[1])}
        ${row(t("onTarget"), st.onTarget[0], st.onTarget[1])}
        ${row(t("saves"), st.saves[0], st.saves[1])}
        ${row(t("possession"), possA + "%", 100 - possA + "%")}
      </tbody></table>
      <div class="sum-sc"><div><small>${esc(CT.teamName(A))}</small><p>${sc(0)}</p></div><div><small>${esc(CT.teamName(B))}</small><p>${sc(1)}</p></div></div>
      ${mvp ? `<p class="mvp">⭐ ${t("mvp")}: <b>${esc(CT.pname(mvp.p))}</b> ${flag(mvp.p.nat)}</p>` : ""}
      <button class="btn primary big" data-act="afterMatch" id="btn-after">${t("continue")}</button>
    </div>`;
    box.scrollIntoView({ behavior: CT.fx.reduced() ? "auto" : "smooth", block: "nearest" });
    onUserMatchEnd(m);
    if (CT.settings.autoplay) setTimeout(() => { if (S.live === L && $("#btn-after")) A_.afterMatch(); }, 3500);
  }
